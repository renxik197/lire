{% extends "base.html" %}

{% block content %}
<h2 class="fw-bold mb-4">{{ t.truefalse }}</h2>

<div class="card-lire p-4 p-md-5 mx-auto" style="max-width: 640px;">
    <div class="text-muted small mb-2">Idiom</div>
    <h3 class="fw-bold mb-3">{{ phrase }}</h3>

    <div class="p-3 rounded-3 mb-4" style="background: #f8fafc; border: 1px solid var(--lire-border);">
        {{ meaning }}
    </div>

    <div class="d-flex gap-3 justify-content-center mb-3">
        <button type="button" class="btn btn-lire px-4" id="btnTrue">{{ t.true_btn }}</button>
        <button type="button" class="btn btn-outline-lire px-4" id="btnFalse">{{ t.false_btn }}</button>
    </div>

    <div id="feedback" class="text-center fw-semibold" style="display:none;"></div>

    <div class="mt-4 d-flex gap-2 justify-content-center">
        <a href="/memory/truefalse" class="btn btn-lire">{{ t.next }}</a>
        <a href="/memory" class="btn btn-outline-lire">{{ t.back }}</a>
    </div>
</div>

<script>
    const correctAnswer = {{ 'true' if is_true else 'false' }};

    function showResult(userAnswer) {
        const feedback = document.getElementById('feedback');
        const ok = userAnswer === correctAnswer;
        feedback.style.display = 'block';
        feedback.textContent = ok ? "{{ t.correct }}" : "{{ t.incorrect }}";
        feedback.style.color = ok ? '#0d9488' : '#dc2626';

        document.getElementById('btnTrue').disabled = true;
        document.getElementById('btnFalse').disabled = true;
    }

    document.getElementById('btnTrue').addEventListener('click', function () {
        showResult(true);
    });
    document.getElementById('btnFalse').addEventListener('click', function () {
        showResult(false);
    });
</script>
{% endblock %}
