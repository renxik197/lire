{% extends "base.html" %}

{% block content %}
<h2 class="fw-bold mb-4">{{ t.train }}</h2>

<div class="card-lire p-4 p-md-5 mx-auto" style="max-width: 640px;">
    <div class="text-muted small mb-2">Idiom</div>
    <h3 class="fw-bold mb-4">{{ phrase }}</h3>

    <div class="d-grid gap-2">
        {% for opt in options %}
        <button type="button"
                class="btn btn-outline-lire text-start py-3 option-btn"
                data-correct="{{ '1' if opt == correct else '0' }}"
                onclick="checkAnswer(this)">
            {{ opt }}
        </button>
        {% endfor %}
    </div>

    <div id="feedback" class="mt-4 fw-semibold" style="display:none;"></div>

    <div class="mt-4 d-flex gap-2">
        <a href="/memory/train" class="btn btn-lire">{{ t.next }}</a>
        <a href="/memory" class="btn btn-outline-lire">{{ t.back }}</a>
    </div>
</div>

<script>
function checkAnswer(btn) {
    const ok = btn.dataset.correct === '1';
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';
    feedback.textContent = ok ? '{{ t.correct }}' : '{{ t.incorrect }} — {{ correct }}';
    feedback.style.color = ok ? '#0d9488' : '#dc2626';

    document.querySelectorAll('.option-btn').forEach(b => {
        b.disabled = true;
        if (b.dataset.correct === '1') {
            b.style.background = 'rgba(20,184,166,0.15)';
            b.style.borderColor = '#14b8a6';
        }
    });
}
</script>
{% endblock %}
